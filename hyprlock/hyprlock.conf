source = $HOME/.config/hypr/mocha.conf

# Define colors and fonts
$accent = $mauve
$font = JetBrainsMono Nerd Font

# GENERAL
general {
  disable_loading_bar = false
  hide_cursor = true
  grace = 2
  no_fade_in = false
}

# BACKGROUND (Flat solid Mantle)
background {
  monitor =
  path = 
  color = $mantle
}

# THE WIDGET HUB (Solid Surface0 Box)
shape {
  monitor =
  size = 500, 750
  color = $surface0
  rounding = 40
  position = 0, 0
  halign = center
  valign = center
  shadow_passes = 0
}

# USER AVATAR (Top of Hub)
image {
  monitor =
  path = $HOME/.face
  size = 120
  border_size = 4
  border_color = $accent
  rounding = -1
  position = 0, 220
  halign = center
  valign = center
  shadow_passes = 0
}

# TIME (Below Avatar)
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 100
  font_family = $font
  position = 0, 80
  halign = center
  valign = center
  shadow_passes = 0
}

# DATE (Below Time)
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $subtext0
  font_size = 20
  font_family = $font
  position = 0, -10
  halign = center
  valign = center
  shadow_passes = 0
}

# GREETING (Below Date)
label {
  monitor =
  text = Konnichiwa, $USER!
  color = $text
  font_size = 18
  font_family = $font
  position = 0, -60
  halign = center
  valign = center
  shadow_passes = 0
}

# INPUT FIELD (Below Greeting)
input-field {
  monitor =
  size = 350, 60
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $base
  font_color = $text
  fade_on_empty = true
  placeholder_text = <span foreground="##$subtext0Alpha"><i>󰌾 Enter password...</i></span>
  hide_input = false
  check_color = $green
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -160
  halign = center
  valign = center
  shadow_passes = 0
}

# LIVE MEDIA PLAYER (Bottom of Hub)
label {
  monitor =
  text = cmd[update:1000] res=$(playerctl metadata --format '{{title}}   {{artist}}' 2>/dev/null); if [ -z "$res" ]; then echo "󰎆 No media playing"; else echo "$res" | cut -c 1-45; fi
  color = $subtext0
  font_size = 16
  font_family = $font
  position = 0, -280
  halign = center
  valign = center
  shadow_passes = 0
}
