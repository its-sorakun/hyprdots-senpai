# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Format: Two-line prompt
format = """
$directory$git_branch$git_status$nodejs$python$c$rust$golang
$character"""

# Wait timeout for modules (e.g. git status in large repos)
command_timeout = 1000

# Set the palette to Catppuccin Mocha
palette = "catppuccin_mocha"

[character]
# The user's preferred layout: a star to the left of the arrow!
success_symbol = "[✦ ❯](bold green)"
error_symbol = "[✦ ❯](bold red)"
vicmd_symbol = "[✦ ❮](bold lavender)"

[directory]
style = "bold blue"
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold mauve"

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = " "
style = "bold green"

[python]
symbol = " "
style = "bold yellow"

[c]
symbol = " "
style = "bold blue"

[rust]
symbol = " "
style = "bold red"

[golang]
symbol = " "
style = "bold cyan"

# Catppuccin Mocha Palette
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
